# Local, disposable demo only. H2 remains a test-scoped dependency.
# Run with -Dspring-boot.run.useTestClasspath=true and profiles=demo.
server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: false
spring:
  datasource:
    url: jdbc:h2:mem:gachita_demo;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never